[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blebridge-mcp"
version = "1.0.0"
description = "BleBridgeMcp: 通用 BLE 中央/外设双角色桥（blebridge）的 MCP 服务器独立发行包 —— AI 工具面：扫描/连接/GATT 读写订阅/链路调优/本地广播服务/SUOTA 应用流程，内置零硬件 sim 后端。"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "mcp>=2,<3",
]

[project.scripts]
blebridge-mcp = "blebridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
